name: Build Hyrule-Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js (For Svelte UI)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Svelte Frontend
      run: |
        cd ui
        npm install
        npm run build

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Download Go Modules
      run: go mod download

    - name: Compile Executables
      run: |
        mkdir -p bin
        
        echo "Building Linux (amd64)..."
        GOOS=linux GOARCH=amd64 go build -o bin/hyrule-hub-linux-amd64 .
        
        echo "Building Windows (amd64)..."
        GOOS=windows GOARCH=amd64 go build -o bin/hyrule-hub-windows-amd64.exe .
        
        echo "Building macOS (Apple Silicon)..."
        GOOS=darwin GOARCH=arm64 go build -o bin/hyrule-hub-macos-arm64 .
        
        echo "Building macOS (Intel)..."
        GOOS=darwin GOARCH=amd64 go build -o bin/hyrule-hub-macos-amd64 .

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hyrule-hub-binaries
        path: bin/