name: Build and Release Hyrule-Hub

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build Svelte Frontend
      run: |
        cd ui
        npm ci
        npm run build

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Download Go Modules
      run: go mod download

    - name: Compile Executables
      env:
        CGO_ENABLED: 0
      run: |
        mkdir -p bin
        GOOS=linux GOARCH=amd64 go build -o bin/hyrule-hub-linux-amd64 .
        GOOS=windows GOARCH=amd64 go build -o bin/hyrule-hub-windows-amd64.exe .
        GOOS=darwin GOARCH=arm64 go build -o bin/hyrule-hub-macos-arm64 .
        GOOS=darwin GOARCH=amd64 go build -o bin/hyrule-hub-macos-amd64 .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*
        generate_release_notes: true